name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  detect-projects:
    name: Detect Workspace Projects
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_customer_app: ${{ steps.detect.outputs.has_customer_app }}
      has_cleaner_app: ${{ steps.detect.outputs.has_cleaner_app }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if [[ -f backend/package.json ]]; then echo "has_backend=true" >> "$GITHUB_OUTPUT"; else echo "has_backend=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -f apps/customer_app/pubspec.yaml ]]; then echo "has_customer_app=true" >> "$GITHUB_OUTPUT"; else echo "has_customer_app=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -f apps/cleaner_app/pubspec.yaml ]]; then echo "has_cleaner_app=true" >> "$GITHUB_OUTPUT"; else echo "has_cleaner_app=false" >> "$GITHUB_OUTPUT"; fi

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.has_backend == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: atlasclean_test
          POSTGRES_USER: atlasclean
          POSTGRES_PASSWORD: atlasclean_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasclean -d atlasclean_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend lint
        working-directory: backend
        run: npm run lint
      - name: Run backend tests
        working-directory: backend
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: atlasclean_test
          PGUSER: atlasclean
          PGPASSWORD: atlasclean_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-only-jwt-secret-not-used-in-production
          JWT_REFRESH_SECRET: ci-only-refresh-not-used-in-production
          NODE_ENV: test
        run: |
          export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          npm test

  flutter-customer-test:
    name: Customer App Tests
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.has_customer_app == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          cache: true
      - name: Get dependencies
        working-directory: apps/customer_app
        run: flutter pub get
      - name: Run tests
        working-directory: apps/customer_app
        run: flutter test

  flutter-cleaner-test:
    name: Cleaner App Tests
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.has_cleaner_app == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          cache: true
      - name: Get dependencies
        working-directory: apps/cleaner_app
        run: flutter pub get
      - name: Run tests
        working-directory: apps/cleaner_app
        run: flutter test

  shared-packages-test:
    name: Shared Package Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/atlas_design_system
          - packages/atlas_api_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          cache: true
      - name: Get dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: Analyze package
        working-directory: ${{ matrix.package }}
        run: dart analyze lib

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
