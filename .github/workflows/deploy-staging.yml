name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Staging Infrastructure
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.CDK_DEFAULT_ACCOUNT }}
      CDK_DEFAULT_REGION: ${{ vars.CDK_DEFAULT_REGION }}
      ATLAS_DOMAIN_NAME: ${{ vars.ATLAS_DOMAIN_NAME }}
      ATLAS_CERTIFICATE_ARN: ${{ vars.ATLAS_CERTIFICATE_ARN }}
      STAGE: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || vars.CDK_DEFAULT_REGION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/aws/cdk/package.json
      - name: Install CDK dependencies
        working-directory: infrastructure/aws/cdk
        run: npm install
      - name: CDK synth
        working-directory: infrastructure/aws/cdk
        run: npm run synth -- -c stage=staging
      - name: CDK deploy
        working-directory: infrastructure/aws/cdk
        run: npm run deploy:staging
